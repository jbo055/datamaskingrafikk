<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <title>WebGL - Hierarkisk gravemaskin</title>
    <link rel="stylesheet" href="./webgl.css" type="text/css">
    <script src="./lib/cuon-matrix.js"></script>
    <script src="./lib/gl-matrix.js"></script>

</head>

<body>
    <div class="ui" style="top:0px; left:15px; color:black;">
        <h2>WebGL – Hierarkisk gravemaskin</h2>

        FPS: <span id="fps">--</span><br><br>

        J / L: Sving huset<br>
        I / K: Hev og senk bommen<br>
        U / O: Bøy og strekk armen<br>
        N / M: Vipp skuffen<br><br>

        W / A / S / D: Roter kameraet<br>
        B: Zoom inn · V: Zoom ut<br><br>

        Radaren roterer automatisk.
    </div>
    <!-- BASE SHADERS -->
    <script id="base-vertex-shader" type="x-shader/x-vertex">#version 300 es
        in vec3 aVertexPosition;
        in vec2 aTextureCoordinate;

        uniform mat4 uModelMatrix;
        uniform mat4 uViewMatrix;
        uniform mat4 uProjectionMatrix;

        out vec2 vTextureCoordinate;

        void main(void) {
            gl_Position =
                uProjectionMatrix *
                uViewMatrix *
                uModelMatrix *
                vec4(aVertexPosition, 1.0);

            vTextureCoordinate = aTextureCoordinate;
        }
    </script>
    <script id="base-fragment-shader" type="x-shader/x-fragment">#version 300 es
        precision mediump float;

        in vec2 vTextureCoordinate;

        uniform lowp vec4 uFragmentColor;
        uniform sampler2D uSampler;
        uniform bool uUseTexture;

        out lowp vec4 fragColor;

        void main(void) {
            if (uUseTexture) {
                fragColor =
                    texture(uSampler, vTextureCoordinate) *
                    uFragmentColor;
            } else {
                fragColor = uFragmentColor;
            }
        }
    </script>

    <!-- COORD SHADERS -->
    <script id="coord-vertex-shader" type="x-shader/x-vertex">#version 300 es
    in vec3 aVertexPosition;
    in vec4 aVertexColor;
    uniform mat4 uModelViewMatrix;
    uniform mat4 uProjectionMatrix;
    out lowp vec4 vColor;
    void main(void) {
        gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aVertexPosition, 1.0);
        vColor = aVertexColor;
        gl_PointSize = 10.0;    //Merk: Kun i bruk når man tegner POINTS
    }
    </script>
    <script id="coord-fragment-shader" type="x-shader/x-fragment">#version 300 es
    precision mediump float;
    in lowp vec4 vColor;
    out lowp vec4 fragColor;
    void main(void) {
        fragColor = vColor;
    }
    </script>

    <script type="module" >
	    //Bruker strict-mode, betyr bl.a. at variabler må deklareres før bruk, se https://www.w3schools.com/js/js_strict.asp
	    'use strict';
	    import {main} from "./main.js";
	    main();
    </script>
</body>

</html>
