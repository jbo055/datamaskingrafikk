<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Oblig 1 - 3D hus og trær</title>
    <link rel="stylesheet" href="webgl.css">

    <style>
        /* .ui ligger oppå canvaset, som er svart. Uten farge er teksten usynlig. */
        .ui {
            color: white;
            font: 14px sans-serif;
            padding: 8px;
        }
    </style>

    <!--
        VIKTIG: Disse er KLASSISKE script, ikke moduler.
        De legger Matrix4 (cuon-matrix) og vec3/mat4 (gl-matrix) på window,
        slik at Camera.js og shape-klassene kan bruke navnene uten å importere dem.
        Må stå FØR modulen nederst.
    -->
    <script src="lib/cuon-matrix.js"></script>
    <script src="lib/gl-matrix.js"></script>
</head>
<body>

<!-- BaseApp.calculateFps() gjør document.getElementById('fps'). Fjernes dette, krasjer appen. -->
<div class="ui">
    FPS: <span id="fps">0</span><br>
    W A S D = roter kamera &nbsp;|&nbsp; V B = zoom
</div>

<!-- Vertexshader: beregner posisjon og sender fargen videre. -->
<script id="base-vertex-shader" type="x-shader/x-vertex">#version 300 es
    in vec4 aVertexPosition;
    in vec4 aVertexColor;

    uniform mat4 uModelViewMatrix;
    uniform mat4 uProjectionMatrix;

    out lowp vec4 vColor;
    void main(void) {
        gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
        vColor = aVertexColor;
        gl_PointSize = 10.0;
    }
</script>

<!-- Fragmentshader: bestemmer fargen som tegnes. -->
<script id="base-fragment-shader" type="x-shader/x-fragment">#version 300 es
    precision mediump float;

    in lowp vec4 vColor;
    out lowp vec4 fragColor;

    void main(void) {
        fragColor = vColor;
    }
</script>

<!-- Vertexshader for figurer med én felles farge. -->
<script id="uniform-vertex-shader" type="x-shader/x-vertex">#version 300 es
    in vec4 aVertexPosition;

    uniform mat4 uModelViewMatrix;
    uniform mat4 uProjectionMatrix;

    void main(void) {
        gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
    }
</script>

<!-- Fragmentshader som får fargen fra JavaScript. -->
<script id="uniform-fragment-shader" type="x-shader/x-fragment">#version 300 es
    precision mediump float;

    uniform vec4 uColor;

    out vec4 fragColor;

    void main(void) {
        fragColor = uColor;
    }
</script>

<!-- Canvaset lages av WebGLCanvas og legges til i body. Derfor ingen <canvas> her. -->

<script type="module">
    import { Oblig1App } from './main.js';

    const app = new Oblig1App();
    app.animate();
</script>

</body>
</html>
