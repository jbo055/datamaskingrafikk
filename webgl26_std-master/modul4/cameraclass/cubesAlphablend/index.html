<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <title>WebGL Cubes Alpha blend</title>
    <link rel="stylesheet" href="../../../base/webgl.css" type="text/css">
    <script src="../../../base/lib/cuon-matrix.js"></script>
    <script src="../../../base/lib/gl-matrix.js"></script>
</head>

<body>
    <div style="top:0px; left:15px; width:100%; text-align:left; color:black;" class="ui">
        <h2>WebGL Cubes Alpha blend</h2>
        WASD Kamerastyring.<br>
        VB Zoom<br>
    </div>
    <!-- SHADERS -->
    <script id="base-vertex-shader" type="x-shader/x-vertex">#version 300 es
        in vec3 aVertexPosition;
        in vec4 aVertexColor;
        uniform mat4 uModelViewMatrix;
        uniform mat4 uProjectionMatrix;
        out lowp vec4 vColor;
        void main(void) {
            gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aVertexPosition, 1.0);
            vColor = aVertexColor;
            gl_PointSize = 10.0;    //Merk: Kun i bruk når man tegner POINTS
        }
    </script>
    <script id="base-fragment-shader" type="x-shader/x-fragment">#version 300 es
        precision mediump float;
        in lowp vec4 vColor;
        out vec4 fragColor;
        void main(void) {
            fragColor = vColor;
        }
    </script>

    <!-- SHADER som håndterer kun posisjon. -->
    <script id="pos-vertex-shader" type="x-shader/x-vertex">#version 300 es
        in vec4 aVertexPosition;
        uniform mat4 uModelViewMatrix;
        uniform mat4 uProjectionMatrix;

        void main() {
            gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
        }
    </script>
    <script id="pos-fragment-shader" type="x-shader/x-fragment">#version 300 es
        precision mediump float;
        uniform lowp vec4 uFragmentColor;
        out lowp vec4 fragColor;
        void main() {
            fragColor = uFragmentColor;
        }
    </script>

    <!-- SHADER som-col håndterer både posisjon og farge. -->
    <script id="pos-col-vertex-shader" type="x-shader/x-vertex">#version 300 es
        in vec4 aVertexPosition;
        in vec4 aVertexColor;
        uniform mat4 uModelViewMatrix;
        uniform mat4 uProjectionMatrix;
        out lowp vec4 vColor;
        void main() {
            gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
            vColor = aVertexColor;
        }
    </script>
    <script id="pos-col-fragment-shader" type="x-shader/x-fragment">#version 300 es
        precision mediump float;
        in lowp vec4 vColor;
        out lowp vec4 fragColor;
        void main(void) {
            fragColor = vColor;
        }
    </script>

    <script type="module" >
	    //Bruker strict-mode, betyr bl.a. at variabler må deklareres før bruk, se https://www.w3schools.com/js/js_strict.asp
	    'use strict';
	    import {main} from "./cubesAlphablend.js";
	    main();
    </script>
</body>

</html>
